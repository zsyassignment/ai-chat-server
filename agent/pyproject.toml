[project]
name = "learningflow-agent"
version = "0.1.0"
description = "A standalone adaptive learning and deep research agent built with LangGraph"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
  "langchain-core>=1.0,<2.0",
  "langchain-text-splitters>=1.1,<2.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9",
  "pypdf>=5.0,<7.0",
  "qdrant-client>=1.12,<2.0",
  "tavily-python>=0.7,<1.0",
  "mcp>=1.26,<2.0",
  "APScheduler>=3.11,<4.0",
  "fastembed>=0.7,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
reranker = ["sentence-transformers>=3.0,<6.0"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"
